[[iris]]
name = "health-example"
pool = { min = 1, max = 2 }
idle_timeout = "60s"
request_timeout = "60s"
max_sessions_per_auth_context = 2
max_age = "10m"
server = { host = "iris", port = 1972, username = "@{env:WG_USER}", password = "@{env:WG_PASS}" }
endpoints = [{ path = "/mcp/health-example", username = "@{env:APP_USER}", password = "@{env:APP_PASS}" }]
[mcp]
transport = "http"
host = "0.0.0.0"
port = 8080
max_concurrent_requests = 2
[logging]
level = "info"
output = "file"
file = "/tmp/mcp-example-toolkit.log"
